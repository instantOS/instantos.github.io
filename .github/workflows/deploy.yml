# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # The download page bakes in the latest ISO's file name and size, which change
  # whenever instantOS publishes a release. Rebuild daily so a new ISO shows up
  # without waiting for someone to commit to this repository. Scheduled off the
  # hour to avoid the busiest part of GitHub's scheduler queue.
  schedule:
    - cron: '17 4 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      # - uses: pnpm/action-setup@v3 # Uncomment this block if you're using pnpm
      #   with:
      #     version: 9 # Not needed if you've set "packageManager" in package.json
      - uses: oven-sh/setup-bun@v1 # Uncomment this if you're using Bun
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      #     cache: npm # or pnpm / yarn
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: bun install # or pnpm install / yarn install / bun install
      - name: Check installer is current
        run: |
          curl -fsSL https://raw.githubusercontent.com/instantOS/instantCLI/main/scripts/install.sh -o /tmp/instantcli-install.sh
          cmp public/install /tmp/instantcli-install.sh || {
            echo "public/install differs from instantCLI main; run 'just fetchinstall'"
            exit 1
          }
      - name: Build with VitePress
        # Raises the GitHub API rate limit for the release metadata lookup that
        # .vitepress/fetch-releases.mjs runs as a prebuild step. The lookup
        # degrades to the releases page on failure, so a missing token is not
        # fatal.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-26.04
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
